name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同じ PR / ブランチへ続けて push したら古い run を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genyakubu-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: genyakubu-manager/.nvmrc
          cache: npm
          cache-dependency-path: genyakubu-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 印刷 (2 系統) と通常時間割作成・講習作成の Worker 経路は jsdom では
  # 検証できないので、実 Chromium で回す (2026-09-04 から CI に追加)
  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: genyakubu-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: genyakubu-manager/.nvmrc
          cache: npm
          cache-dependency-path: genyakubu-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: genyakubu-manager/playwright-report
          retention-days: 7
